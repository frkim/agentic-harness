name: Publish presentation

# Builds the Marp deck (HTML + PDF) and publishes it to GitHub Pages.
# The deck is served as the site index, with the PDF next to it.

on:
  push:
    branches: [main]
    paths:
      - 'presentations/**'
      - '.marprc.yml'
      - '.github/workflows/publish-presentation.yml'
  pull_request:
    paths:
      - 'presentations/**'
      - '.marprc.yml'
      - '.github/workflows/publish-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build deck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Marp CLI runs from the repository root so that .marprc.yml (theme set, html: true) applies.
      # Chrome is preinstalled on ubuntu-latest and is auto-detected for the PDF export.
      - name: Build HTML deck
        run: npx --yes @marp-team/marp-cli@4.5.1 presentations/agentic-harness-l300.md -o site/index.html

      - name: Build PDF deck with presenter notes
        run: npx --yes @marp-team/marp-cli@4.5.1 presentations/agentic-harness-l300.md --pdf --pdf-notes -o site/agentic-harness-l300.pdf

      - name: Upload deck as a build artefact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-harness-l300
          path: site

      - name: Upload GitHub Pages artefact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
